[tools]
bun = "1.4.4"
# Rune pins its toolchain; keep this equal to app/rust-toolchain.toml.
rust = "1.99.1"

[hooks]
# So `mise install` leaves a fresh checkout ready (Sesh's worktree setup relies on it).
postinstall = "bun install --cwd runtime --frozen-lockfile"

[tasks.install]
description = "Install runtime dependencies"
dir = "runtime"
run = "bun install"

[tasks.dev]
description = "Run Cantrip from source and show the bar on launch (Ctrl-C to quit)"
dir = "app"
env = { CANTRIP_SHOW_ON_LAUNCH = "1" }
run = "cargo run --release"

[tasks.check]
description = "Build, lint and test the app (warning-free)"
dir = "app"
run = [
  "cargo clippy --release --all-targets -- -D warnings",
  "cargo test --release",
]

[tasks.snap]
description = "Render every headless scene of the bar to app/target/snaps/"
dir = "app"
run = """
cargo build --release
mkdir -p target/snaps
for scene in $(target/release/Cantrip --list-scenes 2>/dev/null); do
  target/release/Cantrip --scene "$scene" --snap "target/snaps/$scene.png" --at 1 >/dev/null 2>&1
done
echo "→ app/target/snaps"
"""

[tasks.host]
description = "Run the spell host alone; type protocol JSON on stdin"
dir = "runtime"
run = "bun src/host/main.ts"

[tasks.typecheck]
description = "Typecheck the runtime, example spells, and the website's stack and server code"
run = [
  "cd runtime && bun run typecheck",
  "cd grimoire && ../runtime/node_modules/.bin/tsc --noEmit -p .",
  "bun install --frozen-lockfile >/dev/null && node_modules/.bin/tsc --noEmit -p .",
  "cd site && ../node_modules/.bin/astro sync >/dev/null && ../node_modules/.bin/tsc --noEmit -p .",
]

[tasks.site]
description = "Run the website (site/) locally with alchemy dev, with a local release bucket"
run = "bun install && bun run dev"

[tasks.site-media]
description = "Re-render the website's screenshots and demo video from the app's headless scenes"
run = "scripts/site-media.sh"

[tasks.build]
description = "Build build/Cantrip.app"
run = "scripts/bundle.sh"

[tasks.install-app]
description = "Build Cantrip.app, install it to /Applications, and launch it"
run = "scripts/bundle.sh --install"
