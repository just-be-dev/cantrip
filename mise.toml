[tools]
bun = "1.4.4"
# Rune pins its toolchain; keep this equal to app/rust-toolchain.toml.
rust = "1.99.1"

[tasks.install]
description = "Install runtime dependencies"
dir = "runtime"
run = "bun install"

[tasks.dev]
description = "Run Cantrip from source and show the bar on launch (Ctrl-C to quit)"
dir = "app"
env = { CANTRIP_SHOW_ON_LAUNCH = "1" }
run = "cargo run --release"

[tasks.check]
description = "Build, lint and test the app (warning-free)"
dir = "app"
run = [
  "cargo clippy --release --all-targets -- -D warnings",
  "cargo test --release",
]

[tasks.snap]
description = "Render every headless scene of the bar to app/target/snaps/"
dir = "app"
run = """
cargo build --release
mkdir -p target/snaps
for scene in $(target/release/Cantrip --list-scenes 2>/dev/null); do
  target/release/Cantrip --scene "$scene" --snap "target/snaps/$scene.png" --at 1 >/dev/null 2>&1
done
echo "→ app/target/snaps"
"""

[tasks.host]
description = "Run the spell host alone; type protocol JSON on stdin"
dir = "runtime"
run = "bun src/host/main.ts"

[tasks.typecheck]
description = "Typecheck the runtime and example spells"
run = [
  "cd runtime && bun run typecheck",
  "cd grimoire && ../runtime/node_modules/.bin/tsc --noEmit -p .",
]

[tasks.build]
description = "Build build/Cantrip.app"
run = "scripts/bundle.sh"

[tasks.install-app]
description = "Build, copy to ~/Applications, and launch"
run = "scripts/bundle.sh --install"
